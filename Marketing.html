<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Shaken Circle</title>

<style>
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    margin:0;
    background:#faf7f2;
    color:#1c1c1e;
}

header{
    padding:90px 20px;
    text-align:center;
    background:linear-gradient(135deg,#7a0f1e,#3b0b12);
    color:white;
}

header h1{
    font-size:44px;
    margin-bottom:10px;
}

header p{
    font-size:18px;
    color:#ffffff;
    opacity:1;
}

.badge{
    display:inline-block;
    margin-top:12px;
    padding:6px 12px;
    border-radius:20px;
    background:rgba(255,255,255,0.15);
    font-size:13px;
}

section{
    max-width:900px;
    margin:60px auto;
    padding:0 20px;
}

.feature{
    background:white;
    padding:22px;
    border-radius:14px;
    margin:15px 0;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
    display:flex;
    gap:14px;
}

.icon{
    font-size:26px;
}

.cta{
    text-align:center;
    padding:70px 20px;
}

.button{
    display:inline-block;
    padding:14px 30px;
    background:linear-gradient(135deg,#7a0f1e,#3b0b12);
    color:white;
    border-radius:30px;
    text-decoration:none;
    font-weight:600;
}
</style>
</head>

<body>

<header>
    <h1>The Shaken Circle</h1>
    <p>Shake. Discover. Tell your story.</p>
    <div class="badge">Swift Student Challenge 2026 Winner</div>
</header>

<section>
<h2>A ritual for storytelling</h2>
<p>
A creative storytelling app for children aged 6–8 where every story begins with a shake.
</p>
</section>

</body>
</html>
